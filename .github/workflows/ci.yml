name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GODOT_VERSION: "4.5.1"
  GODOT_RELEASE: "stable"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.10.1"
          python-version: "3.12"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install visual test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/godot
            /usr/local/bin/godot
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-linux

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}_linux.x86_64.zip
          unzip -q Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}_linux.x86_64.zip
          sudo mv Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

      - name: Verify Godot installation
        run: godot --version

      - name: Import project
        run: |
          # Run Godot once to import project resources
          timeout 30 godot --headless --import

      - name: Run spec check
        run: ./tools/ci/run-spec-check.sh

      - name: Run smoke
        run: ./tools/ci/run-smoke.sh

      - name: Run tests
        run: ./tools/ci/run-tests.sh

      - name: Run art pipeline tests
        run: uv run --locked python -m unittest tests/art/test_art_pipeline.py

      - name: Run visual evidence tests
        run: bun test tests/visual/visual-evidence.test.ts tests/agents/review-capture.test.ts

      - name: Test snapshot ownership boundaries
        run: python3 -m unittest discover -s tests/agents -v
