name: CI
# Docs, art sources, and prose don't run: a push of only those skips CI.
on:
  push:
    paths-ignore: ["docs/**", "art/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "art/**", "**/*.md"]

# A newer push to the same branch cancels the run it overtakes: a run's five
# Chromium jobs take every macOS runner GitHub allows at once, so two runs
# queued one behind the other. The newer run tests the older push's changes too.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job checks out only what runs (sparse): art/, docs/, and the screenshot
# baselines are most of the repository (about 750 MB of 800), and a full
# checkout took 30 to 45 s. The e2e shards split each Playwright project by
# recorded running time (tools/ci/shard.ts, tests/e2e/timings.json).
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/art/
            !/docs/
            !/tests/e2e/*-snapshots/
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      # Same commands as `just check` and `just build`.
      - run: bun run check
      - run: bun run build

  # Chromium on macOS runners: they have a GPU (Apple's paravirtual Metal
  # device), where the gameplay flows run five to six times faster than in
  # Linux's software renderer, and its screenshots match the baselines. Each
  # shard checks out only its own specs' baselines (all of them are most of a
  # checkout); the PNGs, not their folders, are left out so they can be added,
  # in the background while the browser cache restores.
  chromium:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    name: chromium ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/art/
            !/docs/
            !/tests/e2e/*-snapshots/*.png
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: |
          bun tools/ci/shard.ts chromium ${{ matrix.shard }}/${{ strategy.job-total }} shard.txt
          awk -F ' › ' '{ print "/tests/e2e/" $2 "-snapshots/*-chromium-darwin.png" }' shard.txt \
            | sort -u > baselines.txt
          ( set +e; xargs git sparse-checkout add < baselines.txt; echo $? > baselines.status ) \
            > baselines.log 2>&1 < /dev/null &
      # Browser downloads, kept until a dependency changes (`playwright
      # install` skips what's there).
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('bun.lock') }}
      - run: bunx playwright install chromium
      - name: Wait for the baselines
        run: |
          for _ in $(seq 600); do [ -f baselines.status ] && break; sleep 0.2; done
          cat baselines.log
          test -f baselines.status && exit "$(cat baselines.status)"
          echo "the baselines' fetch didn't finish in 2 minutes" >&2
          exit 1
      - run: bunx playwright test --project=chromium --test-list shard.txt --reporter=dot,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: report.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-chromium-${{ matrix.shard }}
          path: report.json
          if-no-files-found: ignore
          retention-days: 30
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-chromium-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  # WebKit on Linux runners, which are plentiful (macOS allows five jobs at a
  # time), but each spends about 40 s installing WebKit's system libraries, so
  # it has a shard more than Chromium. Its screenshots are compared locally
  # (playwright.config.ts).
  webkit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    name: webkit ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/art/
            !/docs/
            !/tests/e2e/*-snapshots/
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      # Browser downloads, kept until a dependency changes (`playwright
      # install` skips what's there; the system libraries still install).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-webkit-${{ hashFiles('bun.lock') }}
      - run: bunx playwright install --with-deps webkit
      - run: bun tools/ci/shard.ts webkit ${{ matrix.shard }}/${{ strategy.job-total }} shard.txt
      - run: bunx playwright test --project=webkit --test-list shard.txt --reporter=dot,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: report.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-webkit-${{ matrix.shard }}
          path: report.json
          if-no-files-found: ignore
          retention-days: 30
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-webkit-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
